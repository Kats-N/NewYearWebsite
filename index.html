<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 謹賀新年 - 画像生成ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
            background-color: #fcfaf2;
        }
        .bg-newyear-pattern {
            background-image: radial-gradient(#d4af37 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
        .japanese-border {
            border: 8px double #d4af37;
        }
        @keyframes drift {
            from { transform: translateY(0) rotate(0); }
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .sakura {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 100% 0 100% 0;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: drift 5s linear infinite;
        }
    </style>
